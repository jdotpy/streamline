[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamline"
version = "1.3.0"
description = "CLI tool for doing async tasks and transformations"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "KJ", email = "jdotpy@users.noreply.github.com" }
]
keywords = ["tools"]
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pyyaml",
    "requests",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio",
    "asyncssh",
]

[project.urls]
Homepage = "https://github.com/jdotpy/streamline"
Download = "https://github.com/jdotpy/streamline/tarball/master"

[project.scripts]
streamline = "streamline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["streamline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"